<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Kristie's Hub</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, sans-serif;
      background: #fff;
      color: #111;
      line-height: 1.6;
    }

    img {
      width: 100%;
      display: block;
      object-fit: cover;
    }

    a {
      text-decoration: none;
    }

    /* HEADER */
    header {
      background: #111;
      color: white;
      padding: 20px 7%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .logo {
      font-size: 25px;
      font-weight: bold;
    }

    nav {
      display: flex;
      gap: 25px;
    }

    nav a {
      color: white;
      transition: 0.3s;
    }

    nav a:hover {
      color: #ff4f9a;
    }

    /* BUTTON */
    .button {
      display: inline-block;
      background: #ff4f9a;
      color: white;
      padding: 13px 25px;
      border-radius: 30px;
      font-weight: bold;
      margin-top: 20px;
      transition: 0.3s;
    }

    .button:hover {
      transform: translateY(-3px);
    }

    /* HERO */
    .hero {
      min-height: 80vh;
      padding: 70px 7%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 50px;
      align-items: center;
      background: #fafafa;
    }

    .hero-text {
      max-width: 550px;
    }

    .small-title {
      color: #ff4f9a;
      font-weight: bold;
      letter-spacing: 2px;
      font-size: 13px;
      margin-bottom: 15px;
    }

    .hero h1 {
      font-size: 58px;
      line-height: 1.05;
      margin-bottom: 20px;
    }

    .hero-text > p:not(.small-title) {
      color: #666;
      font-size: 17px;
    }

    .hero-image {
      height: 500px;
      overflow: hidden;
      border-radius: 20px;
    }

    .hero-image img {
      height: 100%;
    }

    /* SECTIONS */
    .section {
      padding: 90px 7%;
    }

    .section-title {
      max-width: 700px;
      margin-bottom: 45px;
    }

    .section-title p {
      color: #ff4f9a;
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    .section-title h2 {
      font-size: 38px;
      line-height: 1.2;
      margin-top: 10px;
    }

    /* SERVICES */
    .service-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
    }

    .service-card {
      background: #f7f7f7;
      border-radius: 18px;
      overflow: hidden;
      transition: 0.3s;
    }

    .service-card:hover {
      transform: translateY(-7px);
    }

    .service-image {
      height: 250px;
    }

    .service-image img {
      height: 100%;
    }

    .service-card h3 {
      padding: 20px 20px 5px;
    }

    .service-card p {
      padding: 0 20px 25px;
      color: #666;
    }

    /* SHOP */
    .shop-section {
      padding: 90px 7%;
      background: #111;
      color: white;
    }

    .shop-section .section-title h2 {
      color: white;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 25px;
    }

    .product-card {
      background: white;
      color: #111;
      border-radius: 18px;
      overflow: hidden;
    }

    .product-card img {
      height: 350px;
    }

    .product-info {
      padding: 25px;
    }

    .product-info p {
      color: #666;
      margin: 8px 0 15px;
    }

    .product-info a {
      color: #ff4f9a;
      font-weight: bold;
    }

    /* GALLERY */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
    }

    .gallery-card {
      overflow: hidden;
      border-radius: 18px;
      background: #f5f5f5;
    }

    .gallery-card img {
      height: 280px;
      transition: 0.4s;
    }

    .gallery-card:hover img {
      transform: scale(1.05);
    }

    .gallery-card h3 {
      padding: 18px;
    }

    /* CONTACT */
    .contact-section {
      padding: 90px 7%;
      background: #f7f7f7;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 50px;
      align-items: center;
    }

    .contact-section h2 {
      font-size: 40px;
      margin-bottom: 15px;
    }

    .contact-section p {
      color: #666;
    }

    .contact-info {
      background: white;
      padding: 35px;
      border-radius: 20px;
    }

    /* FOOTER */
    footer {
      background: #111;
      color: white;
      text-align: center;
      padding: 40px 20px;
    }

    footer p {
      color: #aaa;
      margin-top: 5px;
    }

    @media (max-width: 900px) {

      header {
        flex-direction: column;
        gap: 15
