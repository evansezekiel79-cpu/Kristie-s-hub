* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  font-family: Arial, Helvetica, sans-serif;
  background: #fff;
  color: #151515;
  line-height: 1.6;
}

img {
  display: block;
  width: 100%;
}

a {
  text-decoration: none;
}


/* =========================
   HEADER
========================= */

header {
  background: #111;
  color: white;
  padding: 18px 7%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: sticky;
  top: 0;
  z-index: 1000;
}

.logo {
  font-size: 27px;
  font-weight: 800;
  letter-spacing: -1px;
}

.logo span {
  color: #ff4f9a;
}

nav {
  display: flex;
  gap: 22px;
}

nav a {
  color: white;
  font-size: 14px;
  transition: 0.3s;
}

nav a:hover {
  color: #ff4f9a;
}


/* =========================
   HERO
========================= */

.hero {
  min-height: 85vh;
  padding: 70px 7%;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 55px;
  align-items: center;
  background: #f8f8f8;
}

.hero-text {
  max-width: 600px;
}

.small-title {
  color: #ff4f9a;
  font-size: 13px;
  font-weight: bold;
  letter-spacing: 2px;
}

.hero h1 {
  font-size: 62px;
  line-height: 1.03;
  margin: 18px 0;
}

.hero h1 span {
  color: #ff4f9a;
}

.hero-text p {
  color: #666;
  font-size: 17px;
  max-width: 540px;
}

.hero-image {
  height: 560px;
  overflow: hidden;
  border-radius: 25px;
}

.hero-image img {
  height: 100%;
  object-fit: cover;
}

.button {
  display: inline-block;
  background: #ff4f9a;
  color: white;
  padding: 14px 27px;
  border-radius: 30px;
  font-weight: bold;
  margin-top: 23px;
  transition: 0.3s;
}

.button:hover {
  transform: translateY(-3px);
}


/* =========================
   GENERAL SECTIONS
========================= */

.section {
  padding: 90px 7%;
}

.section-title {
  margin-bottom: 45px;
}

.section-title p {
  color: #ff4f9a;
  font-weight: bold;
  font-size: 13px;
  letter-spacing: 2px;
}

.section-title h2 {
  font-size: 40px;
  line-height: 1.2;
  margin-top: 8px;
}


/* =========================
   SHOP CATEGORIES
========================= */

.categories {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 18px;
}

.category {
  background: #f5f5f5;
  border-radius: 18px;
  overflow: hidden;
  transition: 0.3s;
}

.category:hover {
  transform: translateY(-6px);
}

.category img {
  height: 240px;
  object-fit: cover;
}

.category-content {
  padding: 18px;
}

.category-content h3 {
  margin-bottom: 6px;
}

.category-content p {
  color: #666;
  font-size: 14px;
}


/* =========================
   THRIFT STORE
========================= */

.thrift-section {
  background: #111;
  color: white;
}

.thrift-section .section-title h2 {
  color: white;
}

.thrift-grid {

  grid-template-columns: repeat(3, 1fr);
  gap: 25px;
}
