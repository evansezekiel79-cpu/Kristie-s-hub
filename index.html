<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Kristie's Hub - Nigerian thrift wear, fairly used fashion, accessories, nails and hair."
  >

  <meta
    name="theme-color"
    content="#111111"
  >

  <title>Kristie's Hub | Nigerian Thrift & Fashion</title>

  <style>

    /* =========================================
       RESET
    ========================================= */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family:
        Arial,
        Helvetica,
        sans-serif;
      background: #ffffff;
      color: #171717;
      line-height: 1.6;
    }

    button,
    input {
      font-family: inherit;
    }

    a {
      text-decoration: none;
    }

    img {
      max-width: 100%;
    }


    /* =========================================
       HEADER
    ========================================= */

    header {
      width: 100%;
      background: #111111;
      color: white;
      padding: 17px 6%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 9999;
    }

    .logo {
      color: white;
      font-size: 25px;
      font-weight: 800;
      letter-spacing: -0.5px;
      white-space: nowrap;
    }

    .logo span {
      color: #ff4f9a;
    }

    .menu-button {
      display: none;
      background: none;
      border: none;
      color: white;
      font-size: 28px;
      cursor: pointer;
    }

    nav {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    nav a {
      color: white;
      font-size: 14px;
      font-weight: 600;
      transition: 0.3s;
    }

    nav a:hover {
      color: #ff4f9a;
    }


    /* =========================================
       HERO
    ========================================= */

    .hero {
      min-height: 650px;
      padding: 90px 7%;
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 50px;
      align-items: center;

      background:
        radial-gradient(
          circle at 80% 20%,
          #ff4f9a55,
          transparent 30%
        ),
        linear-gradient(
          135deg,
          #111111,
          #28151f
        );

      color: white;
    }

    .hero-content {
      max-width: 650px;
    }

    .hero-label {
      display: inline-block;
      color: #ff72ad;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 3px;
      margin-bottom: 15px;
    }
