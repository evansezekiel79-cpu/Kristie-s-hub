<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kristie's Hub</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #faf7f8;
  color: #222;
}

header {
  background: #111;
  color: white;
  padding: 18px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: sticky;
  top: 0;
  z-index: 10;
}

.logo {
  font-size: 25px;
  font-weight: bold;
}

.logo span {
  color: #ff4f9a;
}

nav a {
  color: white;
  text-decoration: none;
  margin-left: 15px;
  font-size: 14px;
}

.hero {
  background: linear-gradient(135deg, #111, #3a1828);
  color: white;
  padding: 80px 25px;
  text-align: center;
}

.hero h1 {
  font-size: 45px;
  margin-bottom: 15px;
}

.hero h1 span {
  color: #ff4f9a;
}

.hero p {
  max-width: 600px;
  margin: auto;
  color: #ddd;
  font-size: 17px;
}

.button {
  display: inline-block;
  margin-top: 25px;
  background: #ff4f9a;
  color: white;
  padding: 13px 24px;
  border-radius: 30px;
  text-decoration: none;
  font-weight: bold;
}

section {
  padding: 65px 7%;
}

.title {
  text-align: center;
  margin-bottom: 35px;
}

.title small {
  color: #ff4f9a;
  font-weight: bold;
  letter-spacing: 2px;
}

.title h2 {
  font-size: 34px;
  margin-top: 8px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 22px;
}

.card {
  background: white;
  border-radius: 18px;
  overflow: hidden;
  box-shadow: 0 5px 20px rgba(0,0,0,0.08);
}

.picture {
  height: 270px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 80px;
  background: linear-gradient(135deg, #ffd6e8, #f5e8ef);
}

.card-content {
  padding: 22px;
}

.card-content h3 {
  margin-bottom: 8px;
}

.card-content p {
  color: #666;
  font-size: 14px;
}

.thrift {
  background: #111;
  color: white;
}

.thrift .title h2 {
  color: white;
}

.thrift .card {
  color: #222;
}

.products {
  background: #f3eef1;
}

.contact {
  background: #ffedf5;
  text-align: center;
}

.contact h2 {
  font-size: 38px;
  margin: 10px 0;
}

.contact
